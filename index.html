<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tycoon Sim 2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TYCOON SIM 2</p>
          <h1>Base Planner</h1>
        </div>
        <div class="grid-readout" aria-live="polite">
          <span>Available tiles</span>
          <strong id="tile-count">1225</strong>
        </div>
      </header>

      <section class="workspace" aria-label="Base planning workspace">
        <section class="board-area">
          <section class="workflow" aria-label="Build workflow">
            <p class="panel-label">Build workflow</p>
            <ol id="workflow-steps" class="workflow-steps"></ol>
            <div id="coordinate-summary" class="coordinate-summary" hidden></div>
            <div id="validation-summary" class="validation-summary" hidden></div>
          </section>
          <div class="board-toolbar">
            <div class="board-controls">
              <label class="size-control" for="base-size">
                <span>Base size</span>
                <input id="base-size" type="range" min="14" max="35" value="35" />
                <strong id="size-label">35 × 35</strong>
              </label>
              <div class="zoom-control" role="group" aria-label="Grid zoom controls">
                <span>Grid zoom</span>
                <button id="zoom-out" type="button" aria-label="Zoom grid out">−</button>
                <input id="grid-zoom" type="range" min="100" max="225" step="25" value="150" aria-label="Grid zoom percentage" />
                <button id="zoom-in" type="button" aria-label="Zoom grid in">+</button>
                <strong id="zoom-label">150%</strong>
              </div>
            </div>
            <span id="status">Planning canvas · 1225 tiles available</span>
          </div>
          <div id="stage-preview-summary" class="stage-preview-summary" hidden></div>
          <div class="board-viewport">
            <div class="grid-frame">
              <div id="column-labels" class="column-labels" aria-hidden="true"></div>
              <div id="row-labels" class="row-labels" aria-hidden="true"></div>
              <div id="game-grid" class="game-grid" role="grid" aria-label="35 by 35 build grid"></div>
            </div>
          </div>
          <div id="plan-legend" class="plan-legend" aria-label="Current plan legend"></div>
        </section>
      </section>
    </main>

    <div id="item-tooltip" class="item-tooltip" role="tooltip" hidden></div>

    <dialog id="item-editor" class="item-editor" aria-labelledby="item-editor-title">
      <form method="dialog" class="item-editor-card">
        <div class="item-editor-heading">
          <div>
            <p class="panel-label">Selected item</p>
            <h2 id="item-editor-title">Edit item</h2>
          </div>
          <button class="icon-button" type="button" data-action="close-editor" aria-label="Close item editor">×</button>
        </div>
        <div id="item-editor-details" class="item-editor-details"></div>
        <label class="coordinate-control" for="move-coordinate">
          <span>New top-left coordinate</span>
          <input id="move-coordinate" name="coordinate" type="text" inputmode="text" placeholder="A1 or 1,1" autocomplete="off" />
        </label>
        <p id="item-editor-error" class="item-editor-error" role="alert" hidden></p>
        <div class="item-editor-actions">
          <button type="button" data-action="move-item">Move</button>
          <button type="button" data-action="rotate-left">↶ Rotate left</button>
          <button type="button" data-action="rotate-right">Rotate right ↷</button>
          <button class="danger-button" type="button" data-action="remove-item">Remove</button>
        </div>
      </form>
    </dialog>

    <script src="data/items.generated.js"></script>
    <script src="planner-core.js"></script>
    <script src="data/workflow-state.js"></script>
    <script src="data/coordinate-preview.js"></script>
    <script src="data/optimization-baseline.js"></script>
    <script src="data/optimization-progress.js"></script>
    <script src="data/active-plan.js"></script>
    <script src="app.js"></script>
  </body>
</html>
