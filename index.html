<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tycoon Sim 2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TYCOON SIM 2</p>
          <h1>Base Planner</h1>
        </div>
        <div class="grid-readout" aria-live="polite">
          <span>Available tiles</span>
          <strong id="tile-count">196</strong>
        </div>
      </header>

      <section class="workspace" aria-label="Base planning workspace">
        <section class="board-area">
          <div class="board-toolbar">
            <label class="size-control" for="base-size">
              <span>Base size</span>
              <input id="base-size" type="range" min="14" max="35" value="14" />
              <strong id="size-label">14 × 14</strong>
            </label>
            <span id="status">Planning canvas · 196 tiles available</span>
          </div>
          <div class="board-viewport">
            <div id="game-grid" class="game-grid" role="grid" aria-label="35 by 35 build grid"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
